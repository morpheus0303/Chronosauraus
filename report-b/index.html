<style>
:root{color-scheme:dark;--bg:#07090D;--panel:#0F151E;--panel2:#131B26;--line2:#2A3546;--ink:#E9EDF3;--ink-60:#9BA7B7;--ink-35:#5F6C7E;--accent:#8EB1EA;--lume:#7FE3C4;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.016) 0 22px,transparent 22px 44px)}
[hidden]{display:none!important}
.card{width:100%;max-width:460px}
.back{font-family:var(--mono);font-size:12px;color:var(--ink-60);text-decoration:none}
.back:hover{color:var(--accent)}
h1{font-stretch:118%;font-weight:800;font-size:clamp(30px,7vw,44px);letter-spacing:-.03em;line-height:1;margin:18px 0 8px}
p{color:var(--ink-60);margin:0 0 20px;font-size:15px;line-height:1.5}
form{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:6px;padding:18px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin-bottom:10px}
.field{display:flex;gap:8px}
input[type=password]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:4px;color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(142,177,234,.18)}
button{border:1px solid var(--accent);background:var(--accent);color:#0A0E14;font-weight:700;font-size:14px;border-radius:4px;padding:11px 16px;cursor:pointer}
button:disabled{opacity:.6}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-60);text-transform:none;letter-spacing:0;font-family:inherit}
.check input{accent-color:var(--accent)}
.status{font-family:var(--mono);font-size:12px;min-height:18px;margin-top:10px;color:var(--ink-60)}
.status[data-kind=err]{color:#F2A4A4}.status[data-kind=ok]{color:var(--lume)}
form[data-state=err]{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.opening{font-family:var(--mono);font-size:12px;color:var(--ink-60)}
</style>
